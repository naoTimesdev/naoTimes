[project]
name = "naotimes"
version = "3.2.0-beta.1"
description = "Bot multifungsi tukang suruh Fansub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "discord.py[speed,voice]>=2.7.1,<3",
    "wavelink>=3.5.2,<4",
    "orjson>=3.13.0",
    "Brotli>=1.2.1",
    "faust-cchardet>=3.2.0",
    "uvloop>=0.23.0; os_name == 'posix'",
    "hiredis>=3.5.0; implementation_name == 'cpython'",
    "aiofile>=3.12.3",
    "anyio>=4.16.0",
    "aiolimiter>=1.3.0",
    "dnspython>=2.9.2",
    "ruamel.yaml>=0.19.1",
    "async_lru>=2.4.0",
    "redis>=8.1.0,<9",
    "motor>=3.7.1,<4",
    "odmantic>=1.1.0,<2",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "schema>=0.7.8",
    "markdownify>=1.2.3",
    "kbbi>=0.4.3",
    "tesaurus>=0.1.3",
    "python-magic>=0.4.27; os_name != 'nt'",
    "python-magic-bin>=0.4.14; os_name == 'nt'",
    "pyparsing>=3.3.3",
    "Pillow>=13.0.0",
    "cutlet>=0.5.2",
    "unidic-lite>=1.0.8",
    "arrow>=1.4.0",
    "psutil>=7.2.2",
    "colorama>=0.4.6",
    "coloredlogs>=15.0.1",
    "sentry-sdk>=2.74.0",
    "regex>=2026.9.29",
    "urllib3>=2.8.0",
    "yarl>=1.25.1",
    "certifi>=2026.10.23",
    "typing-extensions>=4.16.0",
    "packaging>=26.3",
    "python-socketio[asyncio_client]>=5.11",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "safety>=3.8.1",
    "watchfiles>=1.0",
    "types-beautifulsoup4>=4.12",
    "ruff",
    "basedpyright>=1.40.2",
]

[tool.uv]
package = false
